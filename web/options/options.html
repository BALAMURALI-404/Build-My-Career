<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BuildMyCareer Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>

  <h1>BuildMyCareer</h1>

  <section>
    <h2>Personal Info</h2>

    <label>
      First Name
      <input type="text" id="first_name">
    </label>

    <label>
      Last Name
      <input type="text" id="last_name">
    </label>

    <label>
      Email
      <input type="email" id="email">
    </label>

    <label>
      Phone
      <input type="text" id="phone">
    </label>
  </section>

  <button id="save">Save</button>

  <p id="status"></p>

  <script src="options.js"></script>
</body>
</html>
